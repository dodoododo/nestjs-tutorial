
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is required}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql-test:
    image: mysql:8.4
    profiles:
      - test
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD:?TEST_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${TEST_DB_NAME:?TEST_DB_NAME is required}
      MYSQL_USER: ${TEST_DB_USER:?TEST_DB_USER is required}
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:?TEST_DB_PORT is required}:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  mysql_test_data:
